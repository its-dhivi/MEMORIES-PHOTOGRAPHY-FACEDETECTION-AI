[project]
name = "memories-face-ai"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.121.2",
  "uvicorn[standard]==0.38.0",
  "pydantic-settings==2.12.0",
  "httpx==0.28.1",
  "pillow==12.0.0",
  "python-multipart==0.0.20",
]
[project.optional-dependencies]
ai = ["onnxruntime==1.23.2", "opencv-python-headless==4.12.0.88", "numpy==2.2.6"]
test = ["pytest==9.0.1", "pytest-asyncio==1.3.0", "ruff==0.14.6", "mypy==1.18.2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","I","B","UP"]
ignore = ["B008"] # FastAPI uses dependency markers in parameter defaults.
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
