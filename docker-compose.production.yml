name: memories-photo-finder
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    logging: &default_logging
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
  redis:
    ports: !reset []
    command:
      [
        'sh',
        '-c',
        'redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging: *default_logging
  minio:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - ${OBJECTS_DATA_DIR:-./data/objects}:/data
    logging: *default_logging
  minio-init:
    volumes: !override
      - ./infrastructure/docker/minio-cors-production.json:/config/minio-cors.json:ro
    logging: *default_logging
  migrate:
    env_file: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    restart: 'no'
    logging: *default_logging
  api:
    env_file: !override [.env.production]
    environment:
      PUBLIC_FACE_MATCHING_ENABLED: ${PUBLIC_FACE_MATCHING_ENABLED:-false}
      PUBLIC_FACE_MATCHING_MODEL_VALIDATED: ${PUBLIC_FACE_MATCHING_MODEL_VALIDATED:-false}
    ports: !reset []
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    logging: *default_logging
  face-ai:
    env_file: !reset []
    restart: unless-stopped
    mem_limit: 2g
    cpus: 3.0
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN}
      FACE_MODEL_PROVIDER: ${FACE_MODEL_PROVIDER:-onnx}
      FACE_MODEL_NAME: ${FACE_MODEL_NAME:-auraface-v1}
      FACE_MODEL_VERSION: ${FACE_MODEL_VERSION:?set FACE_MODEL_VERSION}
      FACE_PREPROCESSING_VERSION: ${FACE_PREPROCESSING_VERSION:-auraface-rgb-112-v1}
      FACE_DETECTION_PIPELINE_VERSION: ${FACE_DETECTION_PIPELINE_VERSION:-phase5-v2}
      FACE_RECOGNITION_MODEL_PATH: ${FACE_RECOGNITION_MODEL_PATH:-/models/auraface.onnx}
      FACE_RECOGNITION_INPUT_NORMALIZATION: ${FACE_RECOGNITION_INPUT_NORMALIZATION:-minus_one_one}
      FACE_DETECTION_MODEL_PATH: ${FACE_DETECTION_MODEL_PATH:-/models/face_detection_yunet_2023mar.onnx}
      FACE_RECOGNITION_OUTPUT_DIMENSION: ${FACE_RECOGNITION_OUTPUT_DIMENSION:-512}
      FACE_EMBEDDING_DIMENSION: ${FACE_EMBEDDING_DIMENSION:-512}
      FACE_DEVICE: cpu
      FACE_MAX_CONCURRENT_INFERENCES: ${FACE_MAX_CONCURRENT_INFERENCES:-1}
    logging: *default_logging
  web:
    env_file: !reset []
    ports: !reset []
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging: *default_logging
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
  reverse-proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_started }
      api: { condition: service_healthy }
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}:/etc/nginx/certs:ro
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:?set S3_PUBLIC_DOMAIN}
      NGINX_ENVSUBST_FILTER: '^(DOMAIN|S3_PUBLIC_DOMAIN)$'
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *default_logging
