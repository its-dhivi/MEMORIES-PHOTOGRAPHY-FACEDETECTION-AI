name: memories-photo-finder
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memories_photo_finder}
      POSTGRES_USER: ${POSTGRES_USER:-memories}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ['5433:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-memories} -d ${POSTGRES_DB:-memories_photo_finder}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ['6379:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-memories-local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-change-me-local-only}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['9000:9000', '9001:9001']
    volumes: [minio_data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: /bin/sh
    command: >-
      -c "aws --endpoint-url http://minio:9000 s3 mb s3://$$S3_BUCKET_ORIGINALS || true;
      aws --endpoint-url http://minio:9000 s3 mb s3://$$S3_BUCKET_DERIVATIVES || true;
      aws --endpoint-url http://minio:9000 s3api put-bucket-cors --bucket $$S3_BUCKET_ORIGINALS --cors-configuration file:///config/minio-cors.json;
      aws --endpoint-url http://minio:9000 s3api put-bucket-cors --bucket $$S3_BUCKET_DERIVATIVES --cors-configuration file:///config/minio-cors.json"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-memories-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-me-local-only}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_ORIGINALS: ${S3_BUCKET_ORIGINALS:-photo-originals}
      S3_BUCKET_DERIVATIVES: ${S3_BUCKET_DERIVATIVES:-photo-derivatives}
    volumes:
      - ./infrastructure/docker/minio-cors.json:/config/minio-cors.json:ro
  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: .env
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 10s
      timeout: 3s
      retries: 10
  face-ai:
    build: { context: ., dockerfile: infrastructure/docker/face-ai.Dockerfile }
    env_file: .env
    volumes: [face_models:/models]
    expose: ['8000']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health/live']
      interval: 10s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
  minio_data:
  face_models:
